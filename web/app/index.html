<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa">
<title>T3Go</title>
<link rel="icon" type="image/svg+xml" href="t3go-mark.svg">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; color: #e8e8e8; font-family: system-ui, sans-serif; }
  body { overflow: hidden; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  body.nsgo-ready #boot { display: none; }
  .web-brand { position: fixed; z-index: 2147483647; top: 10px; right: 16px; display: flex; align-items: baseline;
    font: 800 19px/1 system-ui, sans-serif; letter-spacing: -.6px; text-decoration: none; pointer-events: none; }
  .web-brand strong { color: #009fdf; font: inherit; }
  .web-brand span { color: #8f959e; font-size: 12px; font-weight: 700; letter-spacing: -.2px; }
</style>
</head>
<body>
<div id="boot">Loading T3Go…</div>
<div class="web-brand" role="img" aria-label="T3go"><strong>T3</strong><span>go</span></div>
<script src="wasm_exec.js"></script>
<script>
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch("app.wasm"), go.importObject)
    .then(result => {
      document.body.classList.add("nsgo-ready");
      go.run(result.instance);
    })
    .catch(err => {
      document.getElementById("boot").textContent = "Could not start T3Go: " + err;
    });
</script>
</body>
</html>
