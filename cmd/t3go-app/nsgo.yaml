name: T3Go
id: dev.nsgo.t3go
version: 0.1.0
build_number: 114

icon:
  png: assets/Icon.png

dev:
  target: ios_simulator
  hot_reload: true
  fps: false

apple:
  info:
    NSCameraUsageDescription: Scan a T3Go pairing QR code to add an environment.

mobile:
  # The environment server only a desktop runs.
  exclude_resources: [t3go, t3go.exe]

build:
  output: dist
  open: false
  targets: [ios_simulator]
