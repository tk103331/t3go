name: Release MyGo client

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS signs the desktop apps, makes the disk images and builds the
    # iOS simulator app. Everything else is cross-compiled from there.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.1.12297006"

      - name: Test
        run: |
          # The UI suite depends on hosted-runner fonts and timing; it runs
          # during development. This gate covers the CLI, server,
          # orchestrator, providers, Git, client and store.
          go test $(go list ./... | grep -v '/internal/app$') -count=1 -timeout=20m

      - name: Check the tag names this version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' mygo.json)"
          if [ -z "$version" ]; then
            echo "::error::mygo.json has no version"
            exit 1
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match mygo.json v$version"
            exit 1
          fi

      - name: Build every platform
        env:
          MYGO_UPLOAD: "1"
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-mygo.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Build uploads the native installers and signed update manifests
          # to a draft of this tag; add the download page's artifacts, then
          # publish it so installed apps see the update.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "T3Go $TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Keep the artifacts on the workflow run
        uses: actions/upload-artifact@v4
        with:
          name: T3Go-${{ inputs.tag || github.ref_name }}
          path: release/*
          retention-days: 14